site_name: Hammy
site_description: NumPy/Numba-accelerated quaternion mathematics for 3D rotations
site_url: https://jpmorrise.github.io/hammy
repo_url: https://github.com/jpmorrise/hammy
repo_name: jpmorrise/hammy
copyright: Copyright &copy; 2026 JP Morrissey

theme:
  name: material
  variant: classic
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: jpmorrise
      repo: hammy
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Basic Concepts: getting-started/concepts.md
  - Tutorials:
    - Creating Quaternions: tutorials/creating-quaternions.md
    - Quaternion Arithmetic: tutorials/arithmetic.md
    - Conversions: tutorials/conversions.md
    - Batch Operations: tutorials/batch-operations.md
  - API Reference:
    - Quaternion Class: reference/quaternion.md
    - Utilities: reference/utilities.md
    - Version: reference/version.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
            annotations_path: brief

extra:
  # Version is injected dynamically by docs_hooks.py
  version: ""
  
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jpmorrise/hammy
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/hammy/
