name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group tests

      - name: Test with pytest
        run: |
          uv run pytest --cov=src/hammy --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage and tests to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml,./junit.xml
          flags: python-${{ matrix.python-version }}
          verbose: true
