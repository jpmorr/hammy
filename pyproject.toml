################################################################################
# Build Configuration
################################################################################
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hammy/__version__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/hammy"]


################################################################################
# Project Configuration
################################################################################
[project]
name = "quatham"
version = "0.2.0"
description = "A lightweight Numpy and Numba accelerated package for handling quaternions and arrays of quaternions."
readme = "README.md"
keywords = ["Quaternion", "NumPy", "Numba", "Converter", "3D", "Rotation"]
license = "BSD-3-Clause"

authors = [
  { name = "JP Morrissey", email = "morrissey.jp@gmail.com" },
]
maintainers  = [
  { name = "JP Morrissey", email = "morrissey.jp@gmail.com" },
]

requires-python = ">=3.12"
dependencies = [
    "numba>=0.60.0",
    "numpy>=2.0.0",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jpmorr/quatham"
Documentation = "https://jpmorr.github.io/quatham/"
Repository = "https://github.com/jpmorr/quatham"
"Bug Tracker" = "https://github.com/jpmorr/quatham/issues"

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.25.0",
]

[dependency-groups]
dev = [
    "hatch>=1.18.2",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "quaternionic>=1.0.18",
    "ruff>=0.17.2",
    "ty>=0.0.92",
]

tests = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]

docs = [
    "zensical>=0.0.70",
    "mkdocstrings[python]>=0.25.0",
]
